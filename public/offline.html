<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14141A" />
    <title>Stramin · Offline</title>
    <style>
      :root { color-scheme: light dark; --bg: #fafafa; --fg: #14141a; --muted: #6b6b76; }
      @media (prefers-color-scheme: dark) { :root { --bg: #14141a; --fg: #f4f4f6; --muted: #a0a0ab; } }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; background: var(--bg); color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; box-sizing: border-box;
      }
      main { max-width: 360px; text-align: center; display: grid; gap: 12px; justify-items: center; }
      h1 { font-size: 22px; margin: 8px 0 0; }
      p { margin: 0; color: var(--muted); line-height: 1.5; }
      button {
        margin-top: 8px; border: 0; border-radius: 999px; padding: 10px 20px; font: inherit; font-weight: 600;
        background: var(--fg); color: var(--bg); cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" width="72" height="72" alt="" />
      <h1>Du er offline</h1>
      <p>Stramin har brug for internet for at hente din træning. Prøv igen, når du har forbindelse.</p>
      <p lang="en">You're offline. Stramin needs a connection to load your training.</p>
      <button type="button" onclick="location.reload()">Prøv igen · Try again</button>
    </main>
  </body>
</html>
